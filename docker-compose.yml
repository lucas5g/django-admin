
services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8887
    ports:
      - "8887:8887"
    volumes:
      - .:/code
    depends_on:
      - db 

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      # POSTGRES_DB: mydatabase

volumes:
  postgres_data: